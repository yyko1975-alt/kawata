<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川田うどん店 お仕事研修 v2</title>
<style>
  :root{
    --brown:#6b4423; --brown-d:#4a2e16; --cream:#fdf6e9; --card:#fffaf0;
    --orange:#e08a2e; --orange-d:#c2701a; --line:#e6d8bf; --ink:#3a2c1c;
    --green:#3f8f4f; --red:#c0392b; --soft:#fff3df; --blue:#2c6cb0; --ice:#3b8fb5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--cream); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
  }
  ruby rt{ font-size:.55em; color:#b08a4a; font-weight:400; user-select:none; }
  body.fOff rt{ display:none; }
  /* 翻訳（英語／インドネシア語）— 日本語の上にふりがな風に表示 */
  .gl{ display:block; font-size:.8em; color:#1d7a8c; font-weight:600; line-height:1.45; margin-bottom:3px; }
  .infoblock .gl, .check .gl{ color:#15616d; }
  header{
    background:linear-gradient(135deg,var(--brown),var(--brown-d));
    color:#fff; padding:12px 16px; display:flex; align-items:center; gap:11px;
    box-shadow:0 2px 8px rgba(0,0,0,.2); flex-shrink:0; position:sticky; top:0; z-index:10;
  }
  .logo{width:42px;height:42px;border-radius:50%;background:var(--cream);
    display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;}
  header .ttl{font-size:17px;font-weight:800;}
  header .sub{font-size:11px;opacity:.85;margin-top:2px;}
  header .spacer{flex:1;}
  .hbtn{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:12.5px;font-weight:700;
    padding:8px 12px;border-radius:18px;cursor:pointer;white-space:nowrap;}
  .hbtn.on{background:#fff;color:var(--brown-d);}
  .hbtn.home{display:none;}
  .hbtn.home.show{display:block;}
  main{flex:1;padding:22px 16px 32px;max-width:720px;margin:0 auto;width:100%;}
  .lead{font-size:21px;font-weight:800;color:var(--brown-d);text-align:center;margin-bottom:6px;}
  .lead-sub{font-size:14.5px;color:#7a6850;text-align:center;margin-bottom:22px;line-height:1.7;}
  .bigbtns{display:flex;flex-direction:column;gap:14px;}
  .bigbtn{background:var(--card);border:2.5px solid var(--orange);border-radius:18px;
    padding:20px 18px;cursor:pointer;display:flex;align-items:center;gap:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .05s;}
  .bigbtn:active{transform:scale(.98);background:var(--soft);}
  .bigbtn .ic{font-size:38px;flex-shrink:0;width:54px;text-align:center;}
  .bigbtn .bt{font-size:19px;font-weight:800;color:var(--brown-d);}
  .bigbtn .bd{font-size:12.5px;color:#8a7458;margin-top:3px;}
  /* カテゴリ・作業ボタン */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .taskbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:16px 10px;cursor:pointer;text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.05);transition:transform .05s;}
  .taskbtn:active{transform:scale(.97);}
  .taskbtn .ic{font-size:34px;}
  .taskbtn .nm{font-size:14px;font-weight:800;color:var(--brown-d);margin-top:7px;line-height:1.35;}
  .taskbtn .wr{font-size:10.5px;color:#a08763;margin-top:4px;}
  .taskbtn.frozen{border-color:var(--ice);background:#eef8fc;}
  .catbtn{background:var(--card);border:2px solid var(--orange);border-radius:16px;
    padding:16px 14px;cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:11px;
    box-shadow:0 2px 5px rgba(0,0,0,.05);transition:transform .05s;}
  .catbtn:active{transform:scale(.98);background:var(--soft);}
  .catbtn.frozen{border-color:var(--ice);background:#eef8fc;}
  .catbtn .ic{font-size:32px;width:46px;text-align:center;flex-shrink:0;}
  .catbtn .ct{font-size:17px;font-weight:800;color:var(--brown-d);}
  .catbtn .cd{font-size:12px;color:#8a7458;margin-top:2px;}
  .catbtn .cn{font-size:11px;color:#b09a78;margin-top:2px;}
  /* ステップカード（新人・タイミー用）*/
  .progress{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .progress .bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden;}
  .progress .fill{height:100%;background:var(--orange);border-radius:5px;transition:width .25s;}
  .progress .txt{font-size:13px;font-weight:800;color:var(--orange-d);white-space:nowrap;}
  .stepcard{background:var(--card);border:2px solid var(--line);border-radius:20px;
    padding:24px 20px;box-shadow:0 3px 10px rgba(0,0,0,.07);min-height:240px;}
  .stepcard .badge{display:inline-block;background:var(--orange);color:#fff;font-size:14px;font-weight:800;
    padding:6px 16px;border-radius:16px;margin-bottom:14px;}
  .stepcard .badge.intro{background:var(--brown);}
  .stepcard .badge.done{background:var(--green);}
  .stepcard .stitle{font-size:20px;font-weight:800;color:var(--brown-d);margin-bottom:10px;line-height:1.5;}
  .stepcard .sbody{font-size:18px;line-height:1.9;white-space:pre-wrap;}
  .infoblock{margin-top:14px;padding:13px 15px;border-radius:13px;font-size:15px;line-height:1.8;}
  .infoblock.tool{background:#eef6ff;border:1.5px solid #bcd9f5;}
  .infoblock.caution{background:#fff3f1;border:1.5px solid #f3c6bf;}
  .infoblock.danger{background:#fde8e6;border:2px solid var(--red);}
  .infoblock .h{font-weight:800;display:block;margin-bottom:4px;}
  .infoblock.tool .h{color:var(--blue);}
  .infoblock.caution .h{color:var(--red);}
  .infoblock.danger .h{color:var(--red);}
  .check{background:#fffbe6;border:1.5px solid #f0e0a8;border-radius:13px;
    padding:12px 15px;font-size:14px;line-height:1.8;margin-top:14px;color:#8a6d1a;}
  .nav{display:flex;gap:12px;margin-top:18px;}
  .nav button{flex:1;padding:17px 10px;border-radius:16px;font-size:17px;font-weight:800;
    cursor:pointer;border:none;font-family:inherit;}
  .nav .prev{background:#ece1cc;color:var(--brown-d);}
  .nav .prev:disabled{opacity:.4;}
  .nav .next{background:var(--orange);color:#fff;flex:2;}
  .nav .next:active,.nav .prev:active{transform:scale(.98);}
  .nav .finish{background:var(--green);color:#fff;flex:2;}
  .backrow{margin-top:16px;text-align:center;}
  .backrow button{background:none;border:none;color:var(--orange-d);font-size:14px;font-weight:700;
    cursor:pointer;text-decoration:underline;padding:8px;}
  /* 全手順一覧（中堅・ベテラン用）*/
  .listcard{background:var(--card);border:2px solid var(--line);border-radius:18px;
    padding:20px 18px;box-shadow:0 3px 10px rgba(0,0,0,.06);margin-bottom:14px;}
  .listcard h2{font-size:20px;color:var(--brown-d);margin-bottom:4px;}
  .listcard .meta{font-size:12px;color:#a08763;margin-bottom:12px;}
  .listcard ol{margin:8px 0 0 22px;font-size:16px;line-height:1.95;}
  .listcard ul.plain{margin:8px 0 0 20px;font-size:15.5px;line-height:1.9;}
  .listcard li{margin-bottom:5px;}
  .needchk{color:var(--red);font-weight:700;font-size:.9em;}
  /* 印刷 */
  .printlink{display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;margin-top:14px;background:#fff;border:2px dashed var(--orange);
    color:var(--orange-d);border-radius:14px;padding:14px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;}
  .printlink:active{background:var(--soft);}
  .pbar{display:flex;gap:10px;margin-bottom:18px;}
  .pbtn{flex:1;background:var(--orange);color:#fff;border:none;border-radius:14px;
    padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .pbtn.back{background:#ece1cc;color:var(--brown-d);flex:0 0 auto;padding:14px 20px;}
  .printview .ptitle{font-size:22px;color:var(--brown-d);text-align:center;margin-bottom:4px;font-weight:800;}
  .printview .psub{font-size:12px;color:#9a8a6a;text-align:center;margin-bottom:16px;}
  .signrow{font-size:12px;color:#7a6850;border:1px dashed #c9b994;border-radius:8px;
    padding:8px 11px;margin-bottom:14px;}
  .ptask{background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:14px;}
  .ptask h2{font-size:17px;color:var(--brown-d);margin-bottom:3px;}
  .ptask .pmeta{font-size:12px;color:#9a8a6a;margin-bottom:8px;}
  .ptask .pinfo{font-size:13px;background:#f6efe0;border-radius:8px;padding:8px 11px;margin:6px 0;line-height:1.8;}
  .ptask .psteps{margin:9px 0 0 22px;font-size:14px;line-height:2;}
  @media print{
    header,.hbtn,.noprint{display:none !important;}
    body{background:#fff;}
    main{max-width:none;padding:8px;}
    .ptask{page-break-inside:avoid;border:1px solid #bbb;box-shadow:none;}
  }
  /* ご提案書 */
  .pp-title{font-size:21px;font-weight:800;color:var(--brown-d);text-align:center;}
  .pp-sub{font-size:12px;color:#8a7458;text-align:center;margin:5px 0 16px;}
  .pp-intro{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.85;margin-bottom:18px;}
  .pp-sec{margin-bottom:13px;}
  .pp-h{background:var(--brown);color:#fff;font-weight:800;font-size:15px;padding:8px 14px;border-radius:10px 10px 0 0;}
  .pp-c{background:var(--card);border:1.5px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:13px 15px;font-size:13.5px;line-height:1.95;}
  .pp-c b{color:var(--brown-d);}
  .pp-pain{background:#fdf0ee;border:1px solid #efccc5;border-radius:8px;padding:8px 11px;margin:6px 0;font-size:13px;line-height:1.7;}
  .pp-aim{background:#eef7ee;border:1px solid #c5e3c5;border-radius:8px;padding:8px 11px;margin:6px 0;font-size:13.5px;line-height:1.7;}
  .pp-start{display:block;width:100%;margin:22px 0 6px;background:var(--orange);color:#fff;border:none;
    border-radius:16px;padding:18px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;}
  .pp-start:active{background:var(--orange-d);}
  .pp-note{font-size:11.5px;color:#8a7458;text-align:center;}
  .toprop{display:block;width:100%;margin-top:14px;background:none;border:1.5px dashed var(--line);
    color:#8a7458;border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  footer{text-align:center;font-size:11px;color:#a8987d;padding:14px;flex-shrink:0;}
  @media(max-width:380px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header>
  <div class="logo">🍜</div>
  <div>
    <div class="ttl">川田うどん<ruby>店<rt>てん</rt></ruby> お<ruby>仕事<rt>しごと</rt></ruby><ruby>研修<rt>けんしゅう</rt></ruby></div>
    <div class="sub">ボタンを<ruby>押<rt>お</rt></ruby>して、やり<ruby>方<rt>かた</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えよう</div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn home" id="homebtn" onclick="goHome()">🏠 <ruby>最初<rt>さいしょ</rt></ruby></button>
  <button class="hbtn" id="glossbtn" onclick="toggleGloss()">🌐 English</button>
  <button class="hbtn on" id="furibtn" onclick="toggleFuri()">ふりがな ON</button>
</header>

<main id="app"></main>

<footer>川田うどん店 業務マニュアル v2（出典：スタッフ手書きシート38枚 ／ 2026年5月）</footer>

<script>
/* =========================================================
   川田うどん店 お仕事研修アプリ v2（ボタン式・AIなし・完全無料）
   ・冷凍製品製造（福田さん専任）を独立カテゴリ化
   ・入口UX：時間帯（開店前/営業中/閉店作業/冷凍製造/空き時間）→ 中分類 → 作業一覧＋印刷
   ・出典: 2026年5月 スタッフ手書きプロセス分解シート38枚
   ========================================================= */
function R(k,y){ return '<ruby>'+k+'<rt>'+y+'</rt></ruby>'; }
var CHK='<span class="needchk">〔要確認〕</span>';

/* ---- 表記統一ルール（v2）----
   ・手順は「〜する」で終える（一覧リストは「／」区切り可）
   ・数値：温度 -40℃／時間 60分／重量 220g／容量 10cc（数字と単位の間にスペースなし）
   ・同じ意味の語：作業（画面）／手順（ステップ）／清掃（そうじは清掃に統一）
   ・丼もの（井ものは使わない）／団体用（用体用は使わない）
   ・担当者名は画面に表示しない（データの writer は参照用に残す）
   ・未確定は〔要確認〕、未記入担当は表示しない
   ---- */

/* ---- 業務データ（カテゴリ別）----
   task: {id,name,ic,writer,tools,cautions[],steps[],danger?,type?('list')} */
const CATS = [
{
 id:'frozen', ic:'🧊', name:R('冷凍','れいとう')+R('製品','せいひん')+R('製造','せいぞう'),
 sub:'店舗営業とは別枠', note:'冷凍うどん等の製造。ほかの業務とは手順が分かれています。', frozen:true,
 tasks:[
  { id:'niku', name:R('肉','にく')+'うどんセット'+R('作','づく')+'り', ic:'🥩', writer:'福田さん',
    tools:'容器、赤テープ、ラベラー',
    cautions:['肉ねぎの向きに注意する','ふたはしっかり閉める／赤テープは裏側までしっかり止める','肉うどんのシール内容を確認！','折り返しが少ないので、手でおさえながら貼る','シールが商品と合っているか確認！'],
    steps:[
     '肉うどん用の容器を準備する',
     '冷凍真空した肉うどんセットを入れる（袋の余った部分を折り返して入れる）',
     'その横に、解凍した肉ねぎセットを入れる（袋の余った部分を折り返して入れる）',
     'ふたを閉めて、3箇所を赤テープで止める',
     '表（おもて）側に「おいしいお召し上がり方」シールを貼る',
     '裏（底）側に、上は「原材料名」シール、下は「賞味期限」シールを貼る',
     '保冷袋に入れる',
     '入れ口を折り返して、赤テープで止める',
     '袋の表に、肉うどん写真シールを貼る',
     '袋の裏に「ありがとうございます」シール、左下に賞味期限ラベルを貼る',
     '冷凍庫へ入れる'
    ]},
  { id:'nabe', name:R('鍋焼','なべやき')+'・'+R('牛鍋','ぎゅうなべ')+'うどん セット'+R('作','づく')+'り', ic:'🍲', writer:'福田さん',
    tools:'容器、肉型、バット、ラップ、赤テープ、セロテープ、ラベラー、保冷袋、急速冷凍機、タイマー',
    cautions:['冷凍は -40℃で30分くらい '+CHK,'肉ねぎ・にんじんはバラして用意しておく（26枚程度） '+CHK,'判読しづらい箇所は原本シート（S__20365338）で確認のうえ確定する '+CHK],
    steps:[
     '急速冷凍機を立ち上げる（洗剤の水をふく・電源ON）',
     'カットした肉ねぎを解凍させる（約3分ひたす）→ いったん水切り '+CHK,
     '肉型を300g量で出す → バットに入れてラップ → 冷蔵庫へ '+CHK,
     'うどん容器を冷蔵庫から出す',
     '容器に鍋焼（牛鍋）を入れ、肉ねぎセットを横に入れる',
     '具材（肉・水菜・中央にねぎ）を入れる '+CHK,
     'ふたをして、自冷凍庫で冷凍 → 急速冷凍機前で60分スタート '+CHK,
     'うどん分が全部できたらタイマーセット',
     '冷凍が終わったら、余った部分をたたんでセロテープで止める',
     '表（おもて）側の下に「おいしいお召し上がり方」シールを貼る',
     '裏（底）側に、上は「原材料名」シール、下は「賞味期限」シールを貼る',
     '保冷袋に入れる',
     '余った部分をたたんで赤テープで止める',
     '袋の表に「鍋焼の写真」シール・「ありがとうございます」シール、下に賞味期限ラベルを貼る',
     '冷凍庫へ入れる'
    ]},
  { id:'tamago', name:'おでんの'+R('玉子','たまご')+'（'+R('冷凍','れいとう')+'）', ic:'🥚', writer:'福田さん',
    tools:'スチコン機、天板、ミトン、台車、大きい鍋、ボール',
    cautions:['スチームスイッチを確認！','1天板に約30個・4天板入る（最大150個）','大きいバットに全部入れて台車で運ぶと楽'],
    steps:[
     '朝、何個取るか（作るか）を考えてもらう',
     'スチコン横のスチームで予熱 ON',
     '天板に卵を入れ、スチコンに入れる '+CHK,
     '個数に応じてスタート（18〜22分）',
     '終了後、急速冷凍機で蒸らし30分 '+CHK,
     '台車でおでん鍋へ運ぶ '+CHK,
     '丸ごと大きいボールに入れて水につける'
    ]},
  { id:'guzai', name:R('冷凍','れいとう')+' '+R('鍋焼','なべやき')+'・'+R('牛鍋','ぎゅうなべ')+' '+R('具材','ぐざい')+R('作','づく')+'り', ic:'🧊', writer:'福田さん',
    tools:'寸胴鍋、計量カップ（大・小）、大きい鍋、ざる、天板、青い型、ニトリル手袋、急速冷凍機、タイマー、タッパー、マスキングテープ',
    cautions:['ふたを開け、具が入らないようざるを置く '+CHK,'少しあふれても良くない','出汁を床にこぼしたら足で踏まず拭く','棚下に天板が入らないので注意','タイマー横に「肉ねぎ」と貼っておくとわかりやすい','鍋焼・牛鍋 両方つくる'],
    steps:[
     '急速冷凍機前の水をふく → 予冷スタート',
     '寸胴鍋に白だし＋調味料＋みりんを入れる',
     '火にかけ、煮詰まり具合を見て火加減を調整する '+CHK,
     '天板に出汁用の青い型を1枚置く',
     '計量カップで出汁を流し入れる',
     '横から見て水平に入っているか確認し、はみ出た所はそぐ '+CHK,
     '急速冷凍機前の棚に天板を置く → 扉を開け天板を入れ、冷却スタート。これを繰り返す',
     '全部入れたら、タイマー90分スタート',
     '終了後、冷凍の固まり具合を確認（足りなければもう1回入れる）',
     '型から出してタッパーに入れる',
     'タッパー外にマスキングテープで日付を書く'
    ]},
  { id:'toriniku', name:'とり'+R('肉','にく')+'・'+R('牛肉','ぎゅうにく')+'（'+R('冷凍','れいとう')+'）', ic:'🍗', writer:'福田さん',
    tools:'青い天板、肉型、計量カップ、ニトリル手袋、急速冷凍機、タイマー、タッパー、マスキングテープ',
    cautions:['1天板に5枚出す '+CHK,'脂身がはみ出ているものは大きさをそろえてバラす '+CHK,'タイマー横に「とり」「牛」と表示しておく'],
    steps:[
     '在庫と販売量を見て、とり肉・牛肉をもらう',
     '天板に肉型を入れる',
     'とり肉：1個 30g＋煮汁10cc＋塩5cc '+CHK,
     '牛肉：1個 25g＋煮汁10cc＋塩5cc '+CHK,
     '冷凍機前の棚に置き、急速冷凍 90分スタート',
     '終了後、冷凍具合を確認（足りなければもう1度入れる）',

  'factory.asa':{
    en:{name:'Morning start-up to prep', tools:'Key ring, thermometer, sheet, stockpot (zundo), 20kg scale, knife, udon sheet, fire chopsticks, 2L measuring cup, spoon',
      cautions:['Don’t raise the shirodashi flame too high (watch for fire)','Handle the knife carefully','Skim the shirodashi scum frequently','The big pot is hot — beware of burns'],
      steps:['[Start up] Open the warehouse, fridge, back-door locks / open the gas main / wash hands & gargle / fill in thermometer & checklist / turn on the kitchen & prep-room lights','[Re-treading the rough flour 4:40-5:00] Open the sheet and re-tread the flour roughly trodden the day before','[Light shirodashi & oden broth 5:00-] Open the pot lid, add dried sardines & kelp / put oden broth on the stove and bring to a boil / turn on the two fryers','[Making dango 5:05-] With the 20kg scale, cut into 2.5kg portions in thirds with a knife and make dango','[Making zabuton 6:20-7:30] Throw the sheet, line up 6 dango and tread. After firming 6, stack 3+3, dust with flour and tread again to make zabuton','[Switch shirodashi 6:30] Lower to low heat. Remove sardines & kelp with fire chopsticks. Add urume & mackerel flakes to the pot, skimming scum each time','[Set the rice 6:40] Open the rice lid, fill the tank with water and wash 2 sho of rice (twice). Measure 3900mL with the 2L cup and set the rice','[Floor & oden broth prep 6:45] Carry oden broth to the floor and pour into the frame. Also transfer kitchen oden broth to the dedicated pot','[Turn on the rice switch 7:00] Note: customers may confuse it with the sushi timing if they flip the shop switch','[Add bonito flakes to shirodashi 7:30] Add flakes, stop the heat after 1 min, and skim scum again','[Strain shirodashi 7:50-]','[Morning break 8:00]','[Noodle cutting 8:30-] Weekdays 10:00 / finish noodle cutting on weekends (to confirm)','[Turn on the big pot 8:40] Takes about 50 min to heat up','[Light the water-bath gas & boil noodles] (to confirm)','[Turn on the big pot 9:30] Boiling time about 23 min. Check the heat later','[Take boiled udon balls 9:55-]','[10:00 Shop opens] Put out the noren / pass the orders / cook and plate the donburi & hotpot orders','Make the pot condiments / check the order sheet and prepare udon / add kake-dashi','[A] Boil & lift udon from the pot. Check for hot udon and serve','[B] Take the udon balls (men take turns to break). Get into the pot and repeat A & B','Make noodles for the evening / clean the machines (noodle roller & cutter)','[When busy] Boil udon (mensen) in the big pot ~23 min, then rinse off the slime and take the udon balls','[Afternoon udon boiling 14:00-] Boil udon so the boiled udon balls don’t run out','[JA, Greenpia, Asaichi 14:30-] Take boiled udon (to confirm)','[Check shirodashi level 16:00-] Check the remaining donburi-dashi & tsuke-dashi','[Add donburi-dashi & tsuke-dashi 16:30-]','[Check orders, cook & plate 17:00-]','[Boil the last noodles 18:30-]','[Wash the big pot 18:55-] Scrub the slime with the green scrubber. Run hot/cold water inside to cool and remove dirt. Drain water with the hose','[Fill the big pot with water]','[Wash the 2 tanks 19:20-]','[Wash the water bath 19:30-] Put 3 buckets of water to cool the bath, then scrub the surrounding dirt with the green scrubber','[Wipe with towel, 7:40pm] Around the water bath, 2 tanks, and tub','[Cool the oden broth] Fill the tank with ice water and cool the oden broth','[Prepare rice (2 sho) / fill the shirodashi pot with water]','[Clean the floor (kitchen) / wipe the fridge / store oden broth in the fridge, after 8:00pm]']},
    id:{name:'Persiapan pagi hingga prep', tools:'Gantungan kunci, termometer, lembaran, timbangan 20kg, pisau, lembar udon, sumpit api, gelas takar 2L, sendok',
      cautions:['Jangan besarkan api shirodashi terlalu tinggi (waspada kebakaran)','Tangani pisau dengan hati-hati','Buang busa shirodashi secara rutin','Panci besar panas — hati-hati luka bakar'],
      steps:['[Mulai] Buka kunci gudang, kulkas, pintu belakang / buka keran gas utama / cuci tangan & kumur / isi termometer & checklist / nyalakan lampu dapur & ruang prep','[Injak ulang tepung kasar 4:40-5:00] Buka lembaran dan injak ulang tepung yang diinjak kasar kemarin','[Nyalakan shirodashi & kuah oden 5:00-] Buka tutup panci, masukkan ikan teri kering & kombu / taruh kuah oden di kompor dan didihkan / nyalakan 2 penggorengan','[Membuat dango 5:05-] Dengan timbangan 20kg, potong jadi porsi 2.5kg dibagi tiga dengan pisau dan buat dango','[Membuat zabuton 6:20-7:30] Lempar lembaran, jejer 6 dango dan injak. Setelah 6 padat, tumpuk 3+3, taburi tepung dan injak lagi jadi zabuton','[Ganti shirodashi 6:30] Kecilkan api. Angkat teri & kombu dengan sumpit api. Masukkan serpihan urume & makarel ke panci, buang busa tiap kali','[Siapkan nasi 6:40] Buka tutup beras, isi bak dengan air dan cuci 2 sho beras (2 kali). Takar 3900mL dengan gelas 2L dan siapkan beras','[Prep lantai & kuah oden 6:45] Bawa kuah oden ke lantai dan tuang ke bingkai. Pindahkan juga kuah oden dapur ke panci khusus','[Nyalakan sakelar beras 7:00] Catatan: pelanggan bisa salah dengan waktu sushi kalau menekan sakelar toko','[Masukkan serpihan bonito ke shirodashi 7:30] Masukkan serpihan, matikan api setelah 1 menit, buang busa lagi','[Saring shirodashi 7:50-]','[Istirahat pagi 8:00]','[Memotong mie 8:30-] Hari kerja 10:00 / akhir pekan selesaikan pemotongan mie (perlu dicek)','[Nyalakan panci besar 8:40] Butuh ±50 menit untuk panas','[Nyalakan gas penangas air & rebus mie] (perlu dicek)','[Nyalakan panci besar 9:30] Waktu rebus ±23 menit. Cek panasnya nanti','[Ambil bola udon rebus 9:55-]','[10:00 Toko buka] Pasang noren / proses pesanan / masak & sajikan pesanan donburi & hotpot','Buat bumbu panci / cek lembar pesanan dan siapkan udon / tambah kake-dashi','[A] Rebus & angkat udon dari panci. Cek udon panas dan sajikan','[B] Ambil bola udon (pria gantian istirahat). Masuk ke panci dan ulangi A & B','Buat mie untuk sore / bersihkan mesin (penggiling & pemotong mie)','[Saat ramai] Rebus udon (mensen) di panci besar ±23 menit, bilas lendirnya dan ambil bola udon','[Rebus udon sore 14:00-] Rebus udon agar bola udon rebus tidak habis','[JA, Greenpia, Asaichi 14:30-] Ambil udon rebus (perlu dicek)','[Cek sisa shirodashi 16:00-] Cek sisa donburi-dashi & tsuke-dashi','[Tambah donburi-dashi & tsuke-dashi 16:30-]','[Cek pesanan, masak & sajikan 17:00-]','[Rebus mie terakhir 18:30-]','[Cuci panci besar 18:55-] Gosok lendir dengan spons hijau. Alirkan air panas/dingin di dalam untuk mendinginkan & hilangkan kotoran. Buang air dengan selang','[Isi panci besar dengan air]','[Cuci 2 bak 19:20-]','[Cuci penangas air 19:30-] Tuang 3 ember air untuk mendinginkan, lalu gosok kotoran sekitar dengan spons hijau','[Lap dengan handuk, 19:40] Sekitar penangas air, 2 bak, dan ember','[Dinginkan kuah oden] Isi bak dengan air es dan dinginkan kuah oden','[Siapkan beras (2 sho) / isi panci shirodashi dengan air]','[Bersihkan lantai (dapur) / lap kulkas / simpan kuah oden di kulkas, setelah 20:00]']}
  },
  'factory.neri':{
    en:{name:'Factory dough mixing (mixer) — DANGER', tools:'Scale, large bucket, handle, scraper, container, black bag',
      cautions:['★Never put your hands in while it’s running automatically','You can get caught in the flour mixing. Stop the machine before reaching in (use the scraper)','Wrap in a black bag so it doesn’t dry out'],
      steps:['Turn on the scale, set the zero point','Open the mixer lid and check there is no trash','Weigh the flour and add it to the mixer (to confirm)','Close the lid, one-touch the manual button → start. Stop the switch when it stops (to confirm)','Open the salt & water, prepare a scoop & bucket and make the salt water. Measure with the scale (to confirm)','Open the mixer lid and set the salt water evenly on the helper jig','Press the auto-run switch','Add the salt water','After adding salt water, remove the helper jig','Run the mixer (auto ~3-5 min / reverse ~190 sec mixing) (to confirm)','When it slows and the flour comes together, press “stop” once and open the lid','Check the kneading by hand and scrape down the lumps','Close the lid and press the auto-run button again','After ~190 sec of reverse run, it stops automatically','Open the lid, remove the lock bar and turn the handle left','Prepare a black bag in the container and wrap the finished dough (so it doesn’t dry)','If mixing 2 batches, repeat the same steps twice','[Salt level / amount / temperature rules] Weekdays 2 batches 25kg×2; Saturday 25kg×2 + 20kg×1. Per batch: 25kg flour → 11.6kg salt water (9.5kg for 20kg). Salt level guide: outside temp 15℃+ → 11 deg, 20℃+ → 12.0 deg. (to confirm) — confirm the numbers with Kayahara-san']},
    id:{name:'Pengadukan adonan pabrik (mesin) — BAHAYA', tools:'Timbangan, ember besar, gagang, sodet, kontainer, kantong hitam',
      cautions:['★Jangan pernah masukkan tangan saat berjalan otomatis','Bisa terjepit saat tepung diaduk. Hentikan mesin sebelum menjangkau (pakai sodet)','Bungkus dengan kantong hitam agar tidak kering'],
      steps:['Nyalakan timbangan, set titik nol','Buka tutup mesin dan cek tidak ada sampah','Timbang tepung dan masukkan ke mesin (perlu dicek)','Tutup, tekan tombol manual sekali → mulai. Hentikan sakelar saat berhenti (perlu dicek)','Buka garam & air, siapkan gayung & ember dan buat air garam. Takar dengan timbangan (perlu dicek)','Buka tutup mesin dan pasang air garam merata di alat bantu','Tekan sakelar otomatis','Masukkan air garam','Setelah air garam masuk, lepas alat bantu','Jalankan mesin (otomatis ±3-5 menit / mundur ±190 detik) (perlu dicek)','Saat melambat dan tepung menyatu, tekan “stop” sekali dan buka tutup','Cek adonan dengan tangan dan keruk gumpalannya','Tutup dan tekan tombol otomatis lagi','Setelah ±190 detik putaran mundur, berhenti otomatis','Buka tutup, lepas batang pengunci dan putar gagang ke kiri','Siapkan kantong hitam di kontainer dan bungkus adonan jadi (agar tidak kering)','Jika 2 batch, ulangi langkah yang sama dua kali','[Aturan kadar garam / jumlah / suhu] Hari kerja 2 batch 25kg×2; Sabtu 25kg×2 + 20kg×1. Per batch: tepung 25kg → air garam 11.6kg (9.5kg untuk 20kg). Panduan kadar garam: suhu luar 15℃+ → 11, 20℃+ → 12.0. (perlu dicek) — pastikan angkanya dengan Kayahara-san']}
  },

      cautions:['Takes about 1 hour'],
      steps:['Clean in 3 big parts','(1) Use 2 scrapers to remove the flour dirt','(2) Blow out the flour in the gaps with the air compressor','(3) Wipe off the dirt with a wrung wet towel','Wash the bucket, scraper, and the even-feeding helper jig in the sink','Clean the floor and mop, and the cleaning is done']},

  'kitchen.kome':{

      cautions:['If you wrap the net tightly the rice won’t cook well','Wrap the net loosely'],
      steps:['Put leveled rice into the large strainer with a 1-sho measure, wash twice with a bowl (for 2 sho, make two batches)','Set the net in the rice cooker and add the rice','1 sho: 3200mL water / 2 sho: 3900mL water (to confirm)','Wrap loosely with the net','Soak for 30 min','Turn on the switch (take it out after 1 hour)']},

  'kitchen.sushi':{
    en:{name:'Making sushi (chirashi & inari)', tools:'Pot, sushi tub (handai), strainer, omelet pan, oil wiper, pack, scale, bowl, rice paddle, cutting board, knife',
      cautions:['Chirashi: don’t plate on the edges of the pack box / also plate on the center red ginger / face the price sticker toward the customer','Inari: wear gloves / wet the mold with water (so it doesn’t stick, crumble, and sizes match)'],
      steps:['[Chirashi] Run the 6 chirashi bowls through the dishwasher','Take sushi toppings, inari, and snow peas from the fridge. Prepare snow peas for 12 JA sushi and 6 shop chirashi','Boil water in a pot, add a pinch of salt, and quickly blanch the snow peas','Prepare the omelet pan and oil wiper, make shredded egg (for 3 chirashi & donburi omelet)','Spread oil with the wiper, crack egg into a small bowl and mix, pour thin, and when golden move to a flat plate','Cut snow peas diagonally in half. Stack the cooked egg sheets, cut in thirds, then slice thin','Make 1.2 go of sushi vinegar (→ see “Making sushi vinegar”)','Soak the next day’s shiitake in water / prepare the rice jar','Prepare the sushi tub, cool the inside with wood and wipe with a wrung towel. Put 1.2 go (about 2 scoops) of cooker rice into the sushi bowl with the big paddle. Put the rest in the rice jar','Add sushi vinegar to the rice, mix with a cutting motion using the big paddle. Add the toppings made the day before and mix so it scatters evenly','[Inari] If pouches remain, warm in a pot. For new inari, put 1000cc shirodashi in a pot & strainer, simmer the peeled inari. When boiling, lift to the strainer, and keep the broth with a bowl under the strainer','Wear gloves, lift the inari pouch, put 2 katsu-worth of vinegared rice and shape (3 per round), top with sesame & ginger (to confirm)','[Leftover inari] Count and put in a container (count rule to confirm). Write “date & count” on paper, attach, and put in the freezer','[JA pack sushi] Prepare packs with the sushi sticker. For 1.2 go: 12 packs, 150g each, in 6-pack batches; scatter shredded egg evenly, add 2 snow peas. Close the side lid and put on the price sticker (to confirm)']},
    id:{name:'Membuat sushi (chirashi & inari)', tools:'Panci, bak sushi (handai), saringan, wajan telur, pengoles minyak, pak, timbangan, mangkuk, centong, talenan, pisau',
      cautions:['Chirashi: jangan menata di tepi kotak pak / tata juga di jahe merah tengah / hadapkan stiker harga ke pelanggan','Inari: pakai sarung tangan / basahi cetakan dengan air (agar tidak lengket, tidak hancur, ukuran sama)'],
      steps:['[Chirashi] Cuci 6 mangkuk chirashi di mesin pencuci','Keluarkan topping sushi, inari, dan kacang kapri dari kulkas. Siapkan kacang kapri untuk 12 sushi JA dan 6 chirashi toko','Didihkan air di panci, beri sejumput garam, blansir kacang kapri sebentar','Siapkan wajan telur dan pengoles minyak, buat telur iris (untuk 3 chirashi & telur donburi)','Olesi minyak dengan pengoles, pecahkan telur ke mangkuk kecil dan aduk, tuang tipis, jika keemasan pindahkan ke piring datar','Potong kacang kapri serong jadi dua. Tumpuk lembaran telur matang, potong jadi tiga, lalu iris tipis','Buat 1.2 go cuka sushi (→ lihat “Membuat cuka sushi”)','Rendam shiitake untuk besok di air / siapkan toples nasi','Siapkan bak sushi, dinginkan bagian dalam dengan kayu dan lap dengan handuk peras. Masukkan 1.2 go (±2 centong) nasi ke mangkuk sushi dengan centong besar. Sisanya ke toples nasi','Tambahkan cuka sushi ke nasi, aduk dengan gerakan memotong pakai centong besar. Tambahkan topping yang dibuat kemarin dan aduk agar merata','[Inari] Jika ada sisa kantong, hangatkan di panci. Untuk inari baru, masukkan 1000cc shirodashi ke panci & saringan, rebus inari yang sudah dikupas. Saat mendidih, angkat ke saringan, simpan kuah dengan mangkuk di bawah saringan','Pakai sarung tangan, angkat kantong inari, isi nasi cuka sebanyak 2 katsu dan bentuk (3 per putaran), beri wijen & jahe (perlu dicek)','[Sisa inari] Hitung dan masukkan wadah (aturan jumlah perlu dicek). Tulis “tanggal & jumlah” di kertas, tempel, masukkan freezer','[Sushi pak JA] Siapkan pak dengan stiker sushi. Untuk 1.2 go: 12 pak, 150g tiap pak, per 6 pak; taburi telur iris merata, beri 2 kacang kapri. Tutup samping dan beri stiker harga (perlu dicek)']}
  },

/* 言語ボタン：日本語のみ → +English → +Bahasa → 日本語のみ */
function toggleGloss(){

/* 翻訳取得ヘルパー（無ければ null＝日本語のみ表示） */
function trCat(c){ return (gloss!=='off' && TRANS.cat[c.id]) ? TRANS.cat[c.id][gloss] : null; }
function trTask(){ var k=state.cat+'.'+state.task; return (gloss!=='off' && TRANS.task[k]) ? TRANS.task[k][gloss] : null; }
function trTaskById(catId,taskId){ var k=catId+'.'+taskId; return (gloss!=='off' && TRANS.task[k]) ? TRANS.task[k][gloss] : null; }
function trUI(key){ return (gloss!=='off' && TRANS.ui[gloss] && TRANS.ui[gloss][key]) ? TRANS.ui[gloss][key] : null; }
function glL(s){ return s ? '<div class="gl">'+s+'</div>' : ''; }   /* ブロックで上に表示 */
function glU(key){ return glL(trUI(key)); }

function goHome(){ state={screen:"entry",block:null,lane:null,role:"vet",cat:null,task:null,card:0}; render(); }

    return;
  }
  var c=curCat(); var ct=trCat(c);
  var tasks=menuTasks(c);
  var h='<div class="lead">'+glL(ct&&ct.name)+c.ic+' '+c.name+'</div>';
  h+='<div class="lead-sub">'+laneLeadSub()+'</div>';
  h+='<div class="grid">';
  tasks.forEach(function(t){
    var tt=trTaskById(c.id,t.id);
    h+='<div class="taskbtn'+(c.frozen?' frozen':'')+'" onclick="pickTask(\''+t.id+'\')">'+
       '<div class="ic">'+t.ic+'</div><div class="nm">'+glL(tt&&tt.name)+t.name+'</div></div>';
  });
  h+='</div>';
  h+='<div class="backrow"><button onclick="state.screen=\'lane\';render();">← '+R('中分類','ちゅうぶんるい')+'にもどる</button></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
}
function pickTask(id){ state.task=id; state.card=0; state.screen="task"; render(); }

/* 画面4A：ステップ（新人・タイミー）*/
function renderStep(){
  var t=curTask(); var tt=trTask();
  var tc=tt&&tt.cautions, ts=tt&&tt.steps;
  var total=t.steps.length, c=state.card;
  var h='', shown=c+1, totalCards=total+2;
  h+='<div class="progress"><div class="bar"><div class="fill" style="width:'+
     Math.round(shown/totalCards*100)+'%"></div></div>'+
     '<div class="txt">'+shown+' / '+totalCards+'</div></div>';
  function cauHtml(){ return t.cautions.map(function(x,i){ return ((tc&&tc[i])?'<span class="gl">'+tc[i]+'</span>':'')+'・'+x; }).join('<br>'); }
  if(c===0){
    h+='<div class="stepcard">';
    h+='<span class="badge intro">'+(trUI('beginning')||'はじめに')+'</span>';
    h+='<div class="stitle">'+glL(tt&&tt.name)+t.ic+' '+t.name+'</div>';
    h+='<div class="sbody">'+glU('learnThis')+'この'+R('作業','さぎょう')+'の'+R('手順','てじゅん')+'を'+R('確認','かくにん')+'します。</div>';
    if(t.tools) h+='<div class="infoblock tool"><span class="h">🧰 '+(trUI('tools')||R('使','つか')+'う'+R('道具','どうぐ'))+'</span>'+glL(tt&&tt.tools)+t.tools+'</div>';
    if(t.cautions&&t.cautions.length){
      h+='<div class="infoblock '+(t.danger?'danger':'caution')+'"><span class="h">'+(t.danger?'☠️ '+(trUI('dangerLabel')||'きけん！必ず守る'):'⚠️ '+(trUI('cautionsLabel')||R('注意','ちゅうい')+'すること'))+'</span>'+cauHtml()+'</div>';
    }
    h+='</div>';
  } else if(c<=total){
    h+='<div class="stepcard">';
    h+='<span class="badge">'+(trUI('step')||R('手順','てじゅん'))+' '+c+'</span>';
    h+='<div class="sbody">'+((ts&&ts[c-1])?'<div class="gl">'+ts[c-1]+'</div>':'')+t.steps[c-1]+'</div>';
    h+='</div>';
  } else {
    h+='<div class="stepcard">';
    h+='<span class="badge done">'+(trUI('done')||R('完了','かんりょう'))+'</span>';
    h+='<div class="stitle">'+glU('goodjob')+'おつかれさまでした！🎉</div>';
    h+='<div class="sbody">「'+t.name+'」の'+R('手順','てじゅん')+'は ここまでです。\nもう一度見たいときは「← 前」、ほかの作業は下のボタンを押してください。</div>';
    if(t.cautions&&t.cautions.length){
      h+='<div class="infoblock '+(t.danger?'danger':'caution')+'"><span class="h">'+(t.danger?'☠️ '+(trUI('dangerLabel')||'きけんのおさらい'):'⚠️ '+(trUI('cautionsLabel')||R('注意','ちゅうい')+'のおさらい'))+'</span>'+cauHtml()+'</div>';
    }
    h+='</div>';
  }
  h+='<div class="nav">';
  h+='<button class="prev" '+(c===0?'disabled':'')+' onclick="moveCard(-1)">← '+(trUI('prev')||R('前','まえ'))+'</button>';
  if(c<=total){
    h+='<button class="next" onclick="moveCard(1)">'+(c===total?(trUI('toLast')||R('最後','さいご')+'へ'):(trUI('next')||R('次','つぎ'))+' →')+'</button>';
  } else {
    h+='<button class="finish" onclick="state.screen=\'menu\';render();">'+(trUI('otherTask')||'ほかの'+R('作業','さぎょう')+'を'+R('選','えら')+'ぶ')+'</button>';
  }
  h+='</div>';
  h+='<div class="backrow"><button onclick="state.screen=\'menu\';render();">'+R('作業','さぎょう')+R('選','えら')+'びにもどる</button></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
}
function moveCard(d){
  var t=curTask();
  state.card=Math.max(0,Math.min(t.steps.length+1,state.card+d));
  render();
}

/* 画面4B：全手順一覧（中堅・ベテラン）*/
function renderTaskList(){
  var t=curTask(); var tt=trTask();
  var tc=tt&&tt.cautions, ts=tt&&tt.steps;
  var h='<div class="listcard">';
  h+='<h2>'+glL(tt&&tt.name)+t.ic+' '+t.name+'</h2>';
  h+='<div class="meta"></div>';
  if(t.tools) h+='<div class="infoblock tool"><span class="h">🧰 '+(trUI('tools')||R('使','つか')+'う'+R('道具','どうぐ'))+'</span>'+glL(tt&&tt.tools)+t.tools+'</div>';
  if(t.cautions&&t.cautions.length){
    h+='<div class="infoblock '+(t.danger?'danger':'caution')+'"><span class="h">'+(t.danger?'☠️ '+(trUI('dangerLabel')||'きけん！必ず守る'):'⚠️ '+(trUI('cautionsLabel')||R('注意','ちゅうい')+'すること'))+'</span>'+
       t.cautions.map(function(x,i){return ((tc&&tc[i])?'<span class="gl">'+tc[i]+'</span>':'')+'・'+x;}).join('<br>')+'</div>';
  }
  var liHtml=t.steps.map(function(s,i){return '<li>'+((ts&&ts[i])?'<span class="gl">'+ts[i]+'</span>':'')+s+'</li>';}).join('');
  if(t.type==='list'){
    h+='<ul class="plain">'+liHtml+'</ul>';
    h+='<div class="check" style="margin-top:12px;">'+glL(trUI('isList'))+'📌 これは作業の'+R('一覧','いちらん')+'です。1つずつの'+R('手順','てじゅん')+'は今後このツールに追記していきます。</div>';
  } else {
    h+='<ol>'+liHtml+'</ol>';
  }
  h+='</div>';
  h+='<button class="printlink" onclick="state.screen=\'printtask\';render();">'+glL(trUI('printThis'))+'🖨️ この'+R('作業','さぎょう')+'を'+R('紙','かみ')+'に'+R('印刷','いんさつ')+'する（'+R('指示書','しじしょ')+'）</button>';
  h+='<div class="nav"><button class="finish" onclick="state.screen=\'menu\';render();">'+(trUI('otherTask')||'ほかの'+R('作業','さぎょう')+'を'+R('選','えら')+'ぶ')+'</button></div>';
  h+='<div class="backrow"><button onclick="goHome()">← '+R('最初','さいしょ')+'にもどる</button></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
}

/* 作業ごと印刷（指示書）*/
function renderPrintTask(){
  var t=curTask(), c=curCat();
  var h='<div class="pbar noprint">';
  h+='<button class="pbtn" onclick="window.print()">🖨️ いま印刷する</button>';
  h+='<button class="pbtn back" onclick="state.screen=\'task\';render();">← もどる</button></div>';
  h+='<div class="printview">';
  var tt=trTask(); var tc=tt&&tt.cautions, ts=tt&&tt.steps;
  h+='<div class="ptitle">'+glL(tt&&tt.name)+t.ic+' '+t.name+'</div>';
  h+='<div class="psub">川田うどん店 業務指示書 ／ '+c.name+'</div>';
  h+='<div class="signrow">指導日：____年__月__日　　指導者サイン：__________　　受講者サイン：__________</div>';
  h+='<div class="ptask">';
  if(t.tools) h+='<div class="pinfo">🧰 使う道具：'+glL(tt&&tt.tools)+t.tools+'</div>';
  if(t.cautions&&t.cautions.length) h+='<div class="pinfo">⚠️ 注意：'+t.cautions.map(function(x,i){return ((tc&&tc[i])?'<span class="gl">'+tc[i]+'</span>':'')+'・'+x;}).join('<br>')+'</div>';
  var pli=t.steps.map(function(s,i){return '<li>'+((ts&&ts[i])?'<span class="gl">'+ts[i]+'</span>':'')+s+'</li>';}).join('');
  if(t.type==='list'){ h+='<ul class="psteps">'+pli+'</ul>'; }
  else { h+='<ol class="psteps">'+pli+'</ol>'; }
  h+='</div></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
}

/* 全業務 印刷 */
function renderPrintAll(){
  var h='<div class="pbar noprint">';
  h+='<button class="pbtn" onclick="window.print()">🖨️ いま印刷する</button>';
  h+='<button class="pbtn back" onclick="goHome()">← もどる</button></div>';
  h+='<div class="printview">';
  h+='<div class="ptitle">川田うどん'+R('店','てん')+' '+R('業務','ぎょうむ')+'マニュアル v2</div>';
  h+='<div class="psub">出典：スタッフ手書きシート38枚 ／ 2026年5月</div>';
  CATS.forEach(function(c){
    var ct=trCat(c);
    h+='<h2 style="color:var(--brown-d);margin:18px 0 8px;font-size:18px;">'+glL(ct&&ct.name)+c.ic+' '+c.name+'（'+c.sub+'）</h2>';
    c.tasks.forEach(function(t){
      var tt=trTaskById(c.id,t.id); var tc=tt&&tt.cautions, ts=tt&&tt.steps;
      h+='<div class="ptask">';
      h+='<h2>'+glL(tt&&tt.name)+t.ic+' '+t.name+'</h2>';
      if(t.tools) h+='<div class="pinfo">🧰 使う道具：'+glL(tt&&tt.tools)+t.tools+'</div>';
      if(t.cautions&&t.cautions.length) h+='<div class="pinfo">⚠️ 注意：'+t.cautions.map(function(x,i){return ((tc&&tc[i])?'<span class="gl">'+tc[i]+'</span>':'')+'・'+x;}).join('<br>')+'</div>';
      var pli=t.steps.map(function(s,i){return '<li>'+((ts&&ts[i])?'<span class="gl">'+ts[i]+'</span>':'')+s+'</li>';}).join('');
      if(t.type==='list'){ h+='<ul class="psteps">'+pli+'</ul>'; }
      else { h+='<ol class="psteps">'+pli+'</ol>'; }
      h+='</div>';
    });
  });
  h+='</div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
}

render();
</script>
</body>
